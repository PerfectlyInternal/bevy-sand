[package]
name = "bevy-sand"
version = "0.1.0"
edition = "2024"

[lib]
name = "bevy_sand"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bevy_sand_bin"
path = "src/bin.rs"

[dependencies]
bevy = { version = "0.16.1", features = ["dynamic_linking"] }
iyes_perf_ui = "0.5"
noisy_bevy = "0.10"
rand = "0.8.5"
wasm-bindgen = "0.2.100"
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 3

[profile.release]
opt-level = 3
