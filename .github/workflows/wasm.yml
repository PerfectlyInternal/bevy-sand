name: WASM
on: [push, pull_request]

env:
  RUSTFLAGS: '--cfg getrandom_backend="wasm_js"'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'
      - run: wasm-pack build --target web
        with:

